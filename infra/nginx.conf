map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  server_name localhost;
  client_max_body_size 128k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  location ~ ^/api/v1/lessons/[1-9][0-9]*/submission/attachments$ {
    client_max_body_size 2112k;
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite, never append: the client must not be able to inject a value.
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header Origin $http_origin; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $remote_addr; }
  location /ws/ { proxy_pass http://api:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Origin $http_origin; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 60s; }
  location /_astro/ { proxy_pass http://frontend:4321; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { proxy_pass http://frontend:4321; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
}
# Production requires TLS at the ingress, HTTPS APP_ORIGIN and APP_ENV=production.
# Do not run the synthetic seed service in production.
